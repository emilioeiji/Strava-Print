services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: strava_print
      POSTGRES_USER: strava_print
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strava_print"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment: &app-environment
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-docker-development-secret-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-0}
      DATABASE_URL: postgresql://strava_print:${POSTGRES_PASSWORD:-local-development-password}@db:5432/strava_print
      EXPORT_JOBS_INLINE: 0
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5)"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build: .
    env_file: .env
    command: ["sh", "-c", "python manage.py migrate && python manage.py process_export_jobs"]
    environment: *app-environment
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
