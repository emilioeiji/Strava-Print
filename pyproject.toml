[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strava-print"
version = "0.1.0"
description = "Local GPX poster and 3D route generator"
requires-python = ">=3.11"
dependencies = [
    "gpxpy>=1.6",
    "Pillow>=10",
    "reportlab>=4",
    "numpy>=1.26",
    "trimesh>=4",
    "streamlit>=1.36",
    "pypdf>=4",
    "rasterio>=1.4",
    "manifold3d>=3.0",
    "shapely>=2.0",
    "mapbox-earcut>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
strava-print = "strava_print.cli:main"

[tool.setuptools.packages.find]
include = ["strava_print*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
