[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strava-print"
version = "0.1.0"
description = "Commercial Django studio for GPX posters and printable 3D terrain"
requires-python = ">=3.11"
dependencies = [
    "gpxpy>=1.6",
    "Pillow>=10",
    "reportlab>=4",
    "numpy>=1.26",
    "trimesh>=4",
    "pypdf>=4",
    "rasterio>=1.4",
    "manifold3d>=3.0",
    "shapely>=2.0",
    "mapbox-earcut>=1.0",
    "Django>=5.2,<5.3",
    "dj-database-url>=2.3",
    "whitenoise>=6.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.9", "ruff>=0.6", "mypy>=1.11"]
legacy = ["streamlit>=1.36"]
production = [
    "gunicorn>=23",
    "psycopg[binary]>=3.2",
    "django-storages[s3]>=1.14",
    "stripe>=11",
]

[project.scripts]
strava-print = "strava_print.cli:main"

[tool.setuptools.packages.find]
include = ["strava_print*", "strava_print_web*", "studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "strava_print_web.settings"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
